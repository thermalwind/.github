chor="middle" font-size="22" font-weight="600" fill="#ffffff">3</text><text x="816" y="441" text-anchor="start" font-size="16" font-weight="400" fill="#475569">reads</text><text x="978" y="671" text-anchor="start" font-size="16" font-weight="400" fill="#475569">runs</text><text x="1205" y="573" text-anchor="start" font-size="15" font-weight="400" fill="#7c3aed">governs</text><text x="440" y="537" text-anchor="start" font-size="13" font-weight="400" fill="#0f766e">✓ gate — added here</text><text x="800" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">The Model — and the loop it runs</text><text x="800" y="98" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">the AI at the centre works knowledge · data · programs — and runs the loop: fill it · work with it · feed it back</text><text x="40.335468567012185" y="1157.2060631827273" text-anchor="start" font-size="17" font-weight="400" fill="#312e81">1 · FILL IT</text><text x="230.33546856701219" y="1157.2060631827273" text-anchor="start" font-size="15" font-weight="400" fill="#475569">Source + raw → ingest → compiled</text><text x="40.335468567012185" y="1191.2060631827273" text-anchor="start" font-size="17" font-weight="400" fill="#475569">2 · WORK WITH IT</text><text x="230.33546856701219" y="1191.2060631827273" text-anchor="start" font-size="15" font-weight="400" fill="#475569">the AI reads compiled, drafts into data</text><text x="40.335468567012185" y="1225.2060631827273" text-anchor="start" font-size="17" font-weight="400" fill="#0f766e">3 · FEED IT BACK</text><text x="230.33546856701219" y="1225.2060631827273" text-anchor="start" font-size="15" font-weight="400" fill="#475569">a human approves → the document graduates to Source</text><text x="40.335468567012185" y="1271.2060631827273" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">the dotted ring = the AI's domain — the ground the agent works on   ·   a gate is not part of it: we add a gate where a 